databases:
  - name: ner-logix-db
    databaseName: ner_logix
    user: ner_logix

services:
  - type: web
    name: ner-logix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ner-logix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LIVE_DATA_ENABLED
        value: "true"
      - key: RISK_REFRESH_SECONDS
        value: "10"
      - key: RISK_SNAPSHOT_RETENTION_HOURS
        value: "24"
      - key: GPS_SIMULATION_ENABLED
        value: "false"
    disk:
      name: incident-uploads
      mountPath: /data
      sizeGB: 1
