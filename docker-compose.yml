services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smart_logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d smart_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./apps/api/sql/postgis_schema.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:logistics@postgis:5432/smart_logistics
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: local-demo-secret-change-in-production
      FRONTEND_DIR: /app/frontend
      UPLOAD_DIR: /data/uploads
      RISK_SNAPSHOT_RETENTION_HOURS: 24
    ports:
      - "3000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - incident_uploads:/data/uploads

volumes:
  postgis_data:
  incident_uploads:
